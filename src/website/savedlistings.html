<div
  style="
    flex: 1 1 0%;
    overflow: hidden;
    height: calc(100% - 64px);
    max-height: calc(100% - 64px);
  "
>
  <div
    style="
      height: 100%;
      background: rgb(249, 250, 251);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    "
  >
    <div
      style="
        background: linear-gradient(135deg, rgb(20, 82, 40), rgb(33, 122, 60));
        padding: 44px 20px 20px;
      "
    >
      <div style="display: flex; align-items: center; gap: 12px">
        <button
          style="
            background: rgba(255, 255, 255, 0.133);
            border-width: medium;
            border-style: none;
            border-color: currentcolor;
            border-image: initial;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12,19 5,12 12,5"></polyline>
          </svg>
        </button>
        <div>
          <div
            style="font-size: 20px; font-weight: 800; color: rgb(255, 255, 255)"
          >
            Saved Listings
          </div>
          <div
            style="
              font-size: 12px;
              color: rgba(255, 255, 255, 0.533);
              margin-top: 2px;
            "
          >
            0 saved items
          </div>
        </div>
      </div>
    </div>
    <div style="flex: 1 1 0%; overflow-y: auto; padding: 16px 16px 80px">
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 48px 24px;
          gap: 12px;
          text-align: center;
        "
      >
        <div
          style="
            width: 80px;
            height: 80px;
            background: rgb(242, 251, 245);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
          "
        >
          <svg
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#45B86A"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon
              points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
            ></polygon>
          </svg>
        </div>
        <div style="font-size: 17px; font-weight: 700; color: rgb(31, 41, 55)">
          No saved listings
        </div>
        <div
          style="font-size: 13px; color: rgb(107, 114, 128); max-width: 240px"
        >
          Tap the heart icon on any listing to save it here for quick access.
        </div>
        <div style="margin-top: 8px">
          <button
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              background: linear-gradient(
                135deg,
                rgb(33, 122, 60),
                rgb(26, 107, 52)
              );
              color: rgb(255, 255, 255);
              border-width: medium;
              border-style: none;
              border-color: currentcolor;
              border-image: initial;
              border-radius: 12px;
              padding: 9px 16px;
              font-size: 12px;
              font-weight: 600;
              cursor: pointer;
              width: auto;
              box-shadow: rgba(46, 158, 82, 0.267) 0px 4px 12px;
              font-family: 'IBM Plex Sans', sans-serif;
              letter-spacing: 0.01em;
              opacity: 1;
              transition: opacity 0.15s, transform 0.1s;
              -webkit-tap-highlight-color: transparent;
            "
          >
            Browse Marketplace
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
