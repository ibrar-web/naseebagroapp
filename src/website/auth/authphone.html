<!-- first screen -->
<div
  style="
    height: 720px;
    overflow: hidden;
    position: relative;
    background: rgb(249, 250, 251);
    display: flex;
    flex-direction: column;
  "
>
  <div style="flex: 1 1 0%; overflow: hidden; height: 100%; max-height: 100%">
    <div
      style="
        height: 100%;
        background: rgb(255, 255, 255);
        display: flex;
        flex-direction: column;
      "
    >
      <div
        style="
          background: linear-gradient(
            135deg,
            rgb(20, 82, 40),
            rgb(33, 122, 60)
          );
          padding: 48px 24px 32px;
          position: relative;
        "
      >
        <button
          style="
            position: absolute;
            top: 44px;
            left: 16px;
            background: rgba(255, 255, 255, 0.18);
            border-width: medium;
            border-style: none;
            border-color: currentcolor;
            border-image: initial;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
          "
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12,19 5,12 12,5"></polyline>
          </svg>
        </button>
        <div
          style="
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.133);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
          "
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.67A2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 14z"
            ></path>
          </svg>
        </div>
        <div
          style="font-size: 24px; font-weight: 800; color: rgb(255, 255, 255)"
        >
          Enter Phone Number
        </div>
        <div
          style="
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 6px;
          "
        >
          We'll send you a verification code
        </div>
      </div>
      <div
        style="
          flex: 1 1 0%;
          padding: 28px 24px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        "
      >
        <div>
          <label
            style="font-size: 13px; font-weight: 600; color: rgb(55, 65, 81)"
            >Mobile Number</label
          >
          <div style="display: flex; gap: 10px; margin-top: 6px">
            <div
              style="
                padding: 12px 14px;
                border: 1.5px solid rgb(229, 231, 235);
                border-radius: 10px;
                font-size: 14px;
                font-weight: 600;
                color: rgb(55, 65, 81);
                background: rgb(249, 250, 251);
              "
            >
              🇵🇰 +92
            </div>
            <input
              placeholder="3XX XXXXXXX"
              style="
                flex: 1 1 0%;
                padding: 12px 14px;
                border: 1.5px solid rgb(229, 231, 235);
                border-radius: 10px;
                font-size: 14px;
                font-family: 'IBM Plex Sans', sans-serif;
                outline: none;
              "
            />
          </div>
        </div>
        <div
          style="
            background: rgb(242, 251, 245);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#217A3C"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div
            style="font-size: 12px; color: rgb(20, 82, 40); line-height: 1.5"
          >
            Your number is used for account security and trade notifications
            only. We never share it with buyers/sellers.
          </div>
        </div>
        <div style="flex: 1 1 0%"></div>
        <button
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(
              135deg,
              rgb(33, 122, 60),
              rgb(26, 107, 52)
            );
            color: rgb(255, 255, 255);
            border-width: medium;
            border-style: none;
            border-color: currentcolor;
            border-image: initial;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: rgba(46, 158, 82, 0.267) 0px 4px 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            letter-spacing: 0.01em;
            opacity: 1;
            transition: opacity 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
          "
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12,5 19,12 12,19"></polyline></svg
          >Send OTP
        </button>
      </div>
    </div>
  </div>
</div>
