
<!-- third screen -->
<div
  style="
    height: 720px;
    overflow: hidden;
    position: relative;
    background: rgb(249, 250, 251);
    display: flex;
    flex-direction: column;
  "
>
  <div style="flex: 1 1 0%; overflow: hidden; height: 100%; max-height: 100%">
    <div
      style="
        height: 100%;
        background: rgb(255, 255, 255);
        display: flex;
        flex-direction: column;
      "
    >
      <div
        style="
          background: linear-gradient(
            135deg,
            rgb(20, 82, 40),
            rgb(33, 122, 60)
          );
          padding: 48px 24px 32px;
          position: relative;
          overflow: hidden;
        "
      >
        <div
          style="
            position: absolute;
            top: -30px;
            right: -30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.067);
          "
        ></div>
        <div
          style="
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.133);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
          "
        >
          <svg
            width="26"
            height="26"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
        </div>
        <div
          style="font-size: 24px; font-weight: 800; color: rgb(255, 255, 255)"
        >
          Your Location
        </div>
        <div
          style="
            font-size: 13px;
            color: rgba(255, 255, 255, 0.533);
            margin-top: 6px;
            line-height: 1.5;
          "
        >
          We use your city to show you the most relevant listings and market
          rates nearby.
        </div>
      </div>
      <div
        style="
          flex: 1 1 0%;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        "
      >
        <div
          style="
            background: rgb(242, 251, 245);
            border: 1px solid rgb(127, 212, 160);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#217A3C"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <div
            style="font-size: 12px; color: rgb(20, 82, 40); line-height: 1.5"
          >
            Your location is only used to filter nearby listings and improve
            search results. It is never shared with buyers or sellers.
          </div>
        </div>
        <div>
          <label
            style="
              font-size: 13px;
              font-weight: 600;
              color: rgb(55, 65, 81);
              display: block;
              margin-bottom: 8px;
            "
            >Select Your City</label
          >
          <div style="position: relative">
            <select
              style="
                width: 100%;
                padding: 13px 36px 13px 14px;
                border: 1.5px solid rgb(229, 231, 235);
                border-radius: 10px;
                font-size: 14px;
                font-family: 'IBM Plex Sans', sans-serif;
                color: rgb(156, 163, 175);
                background: rgb(255, 255, 255);
                outline: none;
                appearance: none;
                box-sizing: border-box;
              "
            >
              <option value="">Choose your city...</option>
              <option value="Lahore">Lahore</option>
              <option value="Faisalabad">Faisalabad</option>
              <option value="Multan">Multan</option>
              <option value="Gujranwala">Gujranwala</option>
              <option value="Rawalpindi">Rawalpindi</option>
              <option value="Islamabad">Islamabad</option>
              <option value="Karachi">Karachi</option>
              <option value="Peshawar">Peshawar</option>
              <option value="Quetta">Quetta</option>
              <option value="Okara">Okara</option>
              <option value="Sahiwal">Sahiwal</option>
              <option value="Rahim Yar Khan">Rahim Yar Khan</option>
              <option value="Sialkot">Sialkot</option>
              <option value="Sargodha">Sargodha</option>
              <option value="Bahawalpur">Bahawalpur</option></select
            ><span
              style="
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
              "
              ><svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#9CA3AF"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6,9 12,15 18,9"></polyline></svg
            ></span>
          </div>
        </div>
        <div style="flex: 1 1 0%"></div>
        <button
          disabled=""
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(
              135deg,
              rgb(33, 122, 60),
              rgb(26, 107, 52)
            );
            color: rgb(255, 255, 255);
            border-width: medium;
            border-style: none;
            border-color: currentcolor;
            border-image: initial;
            border-radius: 12px;
            padding: 16px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: not-allowed;
            width: 100%;
            box-shadow: rgba(46, 158, 82, 0.267) 0px 4px 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            letter-spacing: 0.01em;
            opacity: 0.6;
            transition: opacity 0.15s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
          "
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12,5 19,12 12,19"></polyline></svg
          >Continue</button
        ><button
          style="
            background: none;
            border-width: medium;
            border-style: none;
            border-color: currentcolor;
            border-image: initial;
            color: rgb(156, 163, 175);
            font-size: 12px;
            cursor: pointer;
            font-family: 'IBM Plex Sans', sans-serif;
            text-align: center;
          "
        >
          Skip for now
        </button>
      </div>
    </div>
  </div>
</div>
